name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Light install: the tests never load torch, diffusers or ultralytics.
      - run: pip install ruff pytest numpy opencv-python-headless pillow matplotlib tqdm pyyaml
      - run: ruff check src tests
      - run: pytest -q
