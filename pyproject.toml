[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plastic-water-seg"
version = "2.0.0"
description = "Detect plastic residue on water bodies: diffusion-synthesized training data, SAM 2 masks, YOLO segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Firat Cem Gurbey" }]
dependencies = [
    "torch>=2.2.0",
    "ultralytics>=8.3.0",
    "diffusers>=0.30.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "rich>=13.0",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0",
]

[project.scripts]
pws-synthesize = "plastic_water_seg.cli:synthesize"
pws-train = "plastic_water_seg.cli:train"
pws-infer = "plastic_water_seg.cli:infer"

[tool.hatch.build.targets.wheel]
packages = ["src/plastic_water_seg"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
